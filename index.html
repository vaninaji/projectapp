<!DOCTYPE html>
<html>
  <head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Food delivery app</title>
    <link rel="stylesheet" href="styleindex.css">
    <script src="data.js"></script>
    <script src="cart.js"></script>

<body>
  <script src="scriptindex.js"></script>
    
  <nav class="top-nav">
        <img src="src/logo.png" alt="Logo" class="logo" onclick="goToMain()">
        <div class="cart-container">
          <div class="cart-icon">
              <img class="cart-svg" src="src/top cart btn.svg" alt="Shopping Cart" onclick="goToCart()"/>
              <div class="cart-counter" id="cartCounter">0</div>
          </div>
      </div>
    </nav>

    <section class="offer-section">
      <div class="offer-text">
        <h1>What We Offer</h1>
        <img src="src/hot sale.png" alt="Hot Sale" class="hot-sale-icon">
        <p>Curious? Here are our most popular menu items.</p>
      </div>

      <div class = "sales">

        <!-- Food Cards -->
      <div class="food-card" id="burger-card" onclick="goToItem('burger')">
        <div class="card-content">
          <div class="food-image-container">
            <img src="src/burgercard.png" alt="Burger" class="food-image">
          </div>
          <div class="price-tag">
            <span>BURGER 54 DHS</span>
          </div>
        </div>
      </div>

      <div class="food-card" id="pizza-card" onclick="goToItem('pizza')">
        <div class="card-content">
          <div class="food-image-container">
            <img src="src/pizzacard.png" alt="Pizza" class="food-image">
          </div>
          <div class="price-tag">
            <span>PIZZA 65 DHS</span>
          </div>
        </div>
      </div>

      <div class="food-card" id="tacos-card" onclick="goToItem('taco')">
        <div class="card-content">
          <div class="food-image-container">
            <img src="src/tacocard.png" alt="Tacos" class="food-image">
          </div>
          <div class="price-tag">
            <span>TACOS 47 DHS</span>
          </div>
        </div>
      </div>
          
      </div>
    </section>

    <script>
      function goToItem(id) {
        window.location.href = `item.html?id=${id}`;
      }
      
      function goToCart() {
        window.location.href = 'cart.html';
      }

      function goToMain() {
        window.location.href = 'main.html';
      }

       // Initialize cart manager
       window.cartManager = new CartManager();

// Your existing cart counter functions (enhanced)
function updateCartCounter() {
    const counter = document.getElementById('cartCounter');
    if (!counter) return;

    // Make sure cart manager is initialized
    if (!window.cartManager) {
        window.cartManager = new CartManager();
    }

    const count = window.cartManager.getCartCount();
    console.log('Updating cart counter to:', count);

    // Update counter text
    counter.textContent = count > 99 ? '99+' : count.toString();

    // Add bounce animation
    counter.classList.add('animate');
    setTimeout(() => {
        counter.classList.remove('animate');
    }, 600);
}

// Initialize cart counter on page load
function initCartCounter() {
    setTimeout(() => {
        updateCartCounter();
    }, 100);
}

// Call this whenever the cart is modified
function onCartUpdated() {
    updateCartCounter();
}

    </script>

</body>
</html>
